services:
  redis:
    image: "redis:6"
    ports:
      - "6379:6379"
  postgres:
    build:
      context: "docker/postgres"
      dockerfile: "DOCKERFILE"
      args:
        - PGHOST=${PGHOST}
        - PGPORT=${PGPORT}
        - PGUSER=${PGUSER}
        - PGPASSWORD=${PGPASSWORD}
        - PGDATABASE=${PGDATABASE}
        - PGTESTUSER=${PGTESTUSER}
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    volumes:
      - "${PWD}/docker/postgres/postgres.conf:/etc/postgresql/postgresql.conf"
    command: ["-c", "config-file=/etc/postgresql/postgresql.conf"]
  task-emulator:
    image: ghcr.io/aertje/cloud-tasks-emulator:latest
    ports:
      - "8123:8123"
    expose:
      - "8123"
    command: [
      "-host", "0.0.0.0",
      "-port", "8123",
      "-queue", "projects/mutuals-local/locations/here/queues/token-processing",
      "-queue", "projects/mutuals-local/locations/here/queues/indexer-refreshes",
      "-queue", "projects/mutuals-local/locations/here/queues/wallet-validate",
    ]
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    expose:
      - "8085"
    ports:
      - "8085:8085"
    command: [
      "/bin/bash",
      "-c",
      "gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=mutuals-local"
    ]
volumes:
  pgdata_timescale:
spec_version: 3.0
package: indexer

logging: INFO

datasources:
  subsquid:
    kind: evm.subsquid
    url: ${SUBSQUID_URL:-https://v2.archive.subsquid.io/network/ethereum-holesky}
  etherscan:
    kind: evm.etherscan
    url: ${ETHERSCAN_URL:-https://api-holesky.etherscan.io/api}
    api_key: ${ETHERSCAN_API_KEY:-''}
  evm_node:
    kind: evm.node
    url: ${NODE_URL:-https://eth-holesky.g.alchemy.com/v2}
    ws_url: ${NODE_WS_URL:-wss://eth-holesky.g.alchemy.com/v2}

contracts:
  pool_factory:
    kind: evm
    address: '0x0D18C5203c227284cf101d447d4cE90c2ae8b906'
    typename: pool_factory
  registry:
    kind: evm
    address: 0xD0a169764a388941FDbB0E1250543ec05eaD4115
    typename: registry

indexes:
  pool_factory_events:
    kind: evm.events
    first_level: 4082934
    datasources:
      - subsquid
      - etherscan
      - evm_node
    handlers:
#      - callback: on_pool_factory_initialized
#        contract: pool_factory
#        name: PoolFactoryInitialized
      - callback: on_pool_created
        contract: pool_factory
        name: PoolCreated
      - callback: on_pool_factory_ownership_transferred
        contract: pool_factory
        name: OwnershipTransferred
  registry_events:
    kind: evm.events
    first_level: 4082928
    datasources:
      - subsquid
      - etherscan
      - evm_node
    handlers:
#      - callback: on_registry_initialized
#        contract: registry
#        name: RegistryInitialized
#      - callback: on_extension_registered
#        contract: registry
#        name: ExtensionRegistered
#      - callback: on_extension_unregistered
#        contract: registry
#        name: ExtensionUnregistered
      - callback: on_registry_ownership_transferred
        contract: registry
        name: OwnershipTransferred


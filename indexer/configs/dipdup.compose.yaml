database:
  kind: postgres
  host: ${POSTGRES_HOST:-timescale}
  port: ${PGPORT:-5433}
  user: ${POSTGRES_USER:-timescale}
  password: ${POSTGRES_PASSWORD:-timescale}
  database: ${POSTGRES_DB:-timescale}

hasura:
  url: http://${HASURA_HOST:-hasura}:8080
  admin_secret: ${HASURA_SECRET:-hasura}
  allow_aggregations: ${HASURA_ALLOW_AGGREGATIONS:-true}
  select_limit: ${HASURA_SELECT_LIMIT:-10000}
  camel_case: ${HASURA_CAMEL_CASE:-true}

sentry:
  dsn: ${SENTRY_DSN:-''}
  environment: ${SENTRY_ENVIRONMENT:-''}

prometheus:
  host: 0.0.0.0

api:
  host: 0.0.0.0

mcp:
  host: 0.0.0.0
  port: 9999
  api_url: http://dipdup:46339
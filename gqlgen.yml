# Where are all the schema files located? globs are supported eg  src/**/*.graphqls
schema:
  - graphql/schema/schema.graphql

# Where should the generated server code go?
exec:
  filename: graphql/generated/generated.go
  package: generated

federation:
  filename: graphql/generated/federation.go
  package: generated
  version: 2

# Where should any generated models go?
model:
  filename: graphql/model/models_gen.go
  package: model

# Where should the resolver implementations go?
resolver:
  layout: follow-schema
  dir: graphql/resolver
  package: graphql

# Optional: turn on use `gqlgen:"fieldName"` tags in your models
# struct_tag: json

# Optional: turn on to use []Thing instead of []*Thing
# omit_slice_element_pointers: false

# Optional: set to speed up generation time by not performing a final validation pass.
# skip_validation: true

# gqlgen will search for any type names in the schema in these go packages
# if they match it will use them, otherwise it will generate them.
autobind:
  - "github.com/mutuals/go-mutuals/graphql/model"

# This section declares type mapping between the GraphQL and go type systems
#
# The first line in each type will be used as defaults for resolver arguments and
# modelgen, the others will be allowed when binding to fields. Configure them to
# your liking
models:
  # Core scalar types
  ID:
    model:
      - github.com/mutuals/go-mutuals/graphql/model.GqlID
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32

  # Blockchain types
  Address:
    model:
      - github.com/mutuals/go-mutuals/service/persist.Address
  Chain:
    model:
      - github.com/mutuals/go-mutuals/service/persist.Chain
  ChainAddress:
    model:
      - github.com/mutuals/go-mutuals/service/persist.ChainAddress
  ChainAddressInput:
    model:
      - github.com/mutuals/go-mutuals/service/persist.ChainAddress
  ChainPubKey:
    model:
      - github.com/mutuals/go-mutuals/service/persist.ChainPubKey
  ChainPubKeyInput:
    model:
      - github.com/mutuals/go-mutuals/service/persist.ChainPubKey
  PubKey:
    model:
      - github.com/mutuals/go-mutuals/service/persist.PubKey
  HexString:
    model:
      - github.com/mutuals/go-mutuals/service/persist.HexString

  # Data types
  JSON:
    model:
      - github.com/mutuals/go-mutuals/service/persist.JSON

  # Wallet types
  WalletType:
    model:
      - github.com/mutuals/go-mutuals/service/persist.WalletType

  # Event types
  Action:
    model:
      - github.com/mutuals/go-mutuals/service/persist.Action

  # User types
  Role:
    model:
      - github.com/mutuals/go-mutuals/service/persist.Role
  DarkMode:
    model:
      - github.com/mutuals/go-mutuals/service/persist.DarkMode

  # Report types
  ReportWindow:
    model:
      - github.com/mutuals/go-mutuals/graphql/model.Window

  # Auth types
  BasicAuthType:
    model:
      - github.com/mutuals/go-mutuals/service/auth/basicauth.AuthTokenType
directives:
  scrub:
    skip_runtime: true

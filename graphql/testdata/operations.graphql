# Query operations
query userByIdQuery($id: ID!) {
    user(id: $id) {
        ... on User {
            id
            roles
        }
        ... on ErrUserNotFound {
            message
        }
        ... on ErrInvalidInput {
            message
            parameters
            reasons
        }
    }
}

query userByAddressQuery($address: Address!) {
    user(address: $address) {
        ... on User {
            id
            roles
        }
        ... on ErrUserNotFound {
            message
        }
        ... on ErrInvalidInput {
            message
            parameters
            reasons
        }
    }
}

query viewerQuery {
    viewer {
        ... on User {
            id
            roles
        }
        ... on ErrNotAuthorized {
            message
            cause {
                ... on ErrNoCookie { message }
                ... on ErrInvalidToken { message }
                ... on ErrSessionInvalidated { message }
                ... on ErrDoesNotOwnRequiredToken { message }
            }
        }
        ... on ErrInvalidInput {
            message
            parameters
            reasons
        }
    }
}


query poolQuery($id: ID, $slug: String, $contractId: ID) {
    pool(id: $id, slug: $slug, contractId: $contractId) {
        ... on Pool {
            id
            name
            description
            status
            image
            donationBps
            slug
            owner {
                ... on User {
                    id
                }
                ... on EVMAccount {
                    address
                    accountType
                }
            }
            createdAt
            updatedAt
        }
        ... on ErrPoolNotFound {
            message
        }
        ... on ErrInvalidInput {
            message
            parameters
            reasons
        }
    }
}


query usersByRoleQuery($role: Role!, $after: String, $first: Int) {
    usersByRole(role: $role, after: $after, first: $first) {
        edges {
            node {
                id
                roles
            }
            cursor
        }
        pageInfo {
            total
            size
            hasPreviousPage
            hasNextPage
            startCursor
            endCursor
        }
    }
}

# Mutation operations
mutation userRegisterMutation {
    userRegister {
        ... on UserRegisterPayload {
            requiresConfirmation
            user {
                id
            }
        }
        ... on ErrAuthenticationFailed {
            message
        }
        ... on ErrUserAlreadyExists {
            message
        }
        ... on ErrInvalidInput {
            message
            parameters
            reasons
        }
        ... on ErrDoesNotOwnRequiredToken {
            message
        }
    }
}

mutation userUpdateMutation($input: UserUpdateInput!) {
    userUpdate(input: $input) {
        ... on UserUpdatePayload {
            user {
                id
            }
        }
        ... on ErrNotAuthorized {
            message
            cause {
                ... on ErrNoCookie {
                    message
                }
                ... on ErrInvalidToken {
                    message
                }
                ... on ErrSessionInvalidated {
                    message
                }
                ... on ErrDoesNotOwnRequiredToken {
                    message
                }
            }
        }
        ... on ErrUsernameNotAvailable {
            message
        }
        ... on ErrInvalidInput {
            message
            parameters
            reasons
        }
    }
}


# Query operations
query userByIdQuery($id: ID!) {
    userById(id: $id) {
        ... on User {
            id
            roles
        }
        ... on ErrUserNotFound {
            message
        }
        ... on ErrInvalidInput {
            message
            parameters
            reasons
        }
    }
}

query userByAddressQuery($input: ChainAddressInput!) {
    userByAddress(chainAddress: $input) {
        ... on User {
            id
            roles
        }
        ... on ErrUserNotFound {
            message
        }
        ... on ErrInvalidInput {
            message
            parameters
            reasons
        }
    }
}

query viewerQuery {
    viewer {
        ... on User {
            id
            roles
        }
        ... on ErrNotAuthorized {
            message
            cause {
                ... on ErrNoCookie { message }
                ... on ErrInvalidToken { message }
                ... on ErrSessionInvalidated { message }
                ... on ErrDoesNotOwnRequiredToken { message }
            }
        }
        ... on ErrInvalidInput {
            message
            parameters
            reasons
        }
    }
}

query notificationsForViewerQuery {
    viewer {
        ... on User {
            notifications(last: 1) {
                unseenCount
                edges {
                    node {
                        id
                        seen
                        creationTime
                    }
                }
                pageInfo {
                    hasNextPage
                    hasPreviousPage
                    startCursor
                    endCursor
                }
            }
        }
        ... on ErrNotAuthorized {
            message
            cause {
                ... on ErrNoCookie { message }
                ... on ErrInvalidToken { message }
                ... on ErrSessionInvalidated { message }
                ... on ErrDoesNotOwnRequiredToken { message }
            }
        }
    }
}

query poolQuery($id: ID, $slug: String, $contractId: ID) {
    pool(id: $id, slug: $slug, contractId: $contractId) {
        ... on Pool {
            id
            name
            description
            status
            image
            donationBps
            slug
            owner {
                ... on User {
                    id
                }
                ... on EVMAccount {
                    address
                    accountType
                }
            }
            createdAt
            updatedAt
        }
        ... on ErrPoolNotFound {
            message
        }
        ... on ErrInvalidInput {
            message
            parameters
            reasons
        }
    }
}

query searchUsersQuery($query: String!, $limit: Int, $usernameWeight: Float) {
    searchUsers(query: $query, limit: $limit, usernameWeight: $usernameWeight) {
        ... on SearchUsersPayload {
            results {
                user {
                    id
                }
            }
        }
        ... on ErrInvalidInput {
            message
            parameters
            reasons
        }
    }
}

query searchPoolsQuery($query: String!, $limit: Int, $nameWeight: Float, $descriptionWeight: Float) {
    searchPools(query: $query, limit: $limit, nameWeight: $nameWeight, descriptionWeight: $descriptionWeight) {
        ... on SearchPoolsPayload {
            results {
                pool {
                    id
                    name
                    description
                }
            }
        }
        ... on ErrInvalidInput {
            message
            parameters
            reasons
        }
    }
}

query isEmailAvailableQuery($emailAddress: Email!) {
    isEmailAddressAvailable(emailAddress: $emailAddress)
}

query usersByRoleQuery($role: Role!, $before: String, $after: String, $first: Int, $last: Int) {
    usersByRole(role: $role, before: $before, after: $after, first: $first, last: $last) {
        edges {
            node {
                id
                roles
            }
            cursor
        }
        pageInfo {
            total
            size
            hasPreviousPage
            hasNextPage
            startCursor
            endCursor
        }
    }
}

# Mutation operations
mutation userRegisterMutation($input: UserRegisterInput!) {
    userRegister(input: $input) {
        ... on UserRegisterPayload {
            requiresConfirmation
            user {
                id
            }
        }
        ... on ErrAuthenticationFailed {
            message
        }
        ... on ErrUserAlreadyExists {
            message
        }
        ... on ErrInvalidInput {
            message
            parameters
            reasons
        }
        ... on ErrDoesNotOwnRequiredToken {
            message
        }
    }
}

mutation userUpdateMutation($userId: ID, $input: UserUpdateInput!) {
    userUpdate(userId: $userId, input: $input) {
        ... on UserUpdatePayload {
            user {
                id
            }
        }
        ... on ErrNotAuthorized {
            message
            cause {
                ... on ErrNoCookie {
                    message
                }
                ... on ErrInvalidToken {
                    message
                }
                ... on ErrSessionInvalidated {
                    message
                }
                ... on ErrDoesNotOwnRequiredToken {
                    message
                }
            }
        }
        ... on ErrUsernameNotAvailable {
            message
        }
        ... on ErrInvalidInput {
            message
            parameters
            reasons
        }
    }
}

mutation userRequestDeletionMutation($redirectUrl: String!) {
    userRequestDeletion(redirectUrl: $redirectUrl) {

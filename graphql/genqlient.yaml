# Default genqlient config; for full documentation see:
# https://github.com/Khan/genqlient/blob/main/docs/genqlient.yaml
schema:
  - schema/schema.graphql
  - schema/federation.graphql
package: graphql_test
optional: pointer
bindings:
  Email:
    type: string
  DBID:
    type: github.com/SplitFi/go-splitfi/service/persist.DBID
  Address:
    type: github.com/SplitFi/go-splitfi/service/persist.Address
  PubKey:
    type: string
  Time:
    type: string
  HexString:
    type: github.com/SplitFi/go-splitfi/service/persist.HexString
operations:
- testdata/*.graphql
generated: generated_test.go
